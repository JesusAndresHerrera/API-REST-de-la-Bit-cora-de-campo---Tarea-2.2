<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="100%" height="100%" fill="white"/>
<text x="80" y="60" font-family="Arial, sans-serif" font-size="35" font-weight="bold" fill="#20252a" text-anchor="start">Recorrido de una petición</text>
<text x="80" y="102" font-family="Arial, sans-serif" font-size="27" font-weight="normal" fill="#56616b" text-anchor="start">Ejemplo: POST /api/registros</text>
<rect x="80" y="170" width="400" height="170" fill="white" stroke="#314f66" stroke-width="2"/>
<rect x="80" y="170" width="400" height="58" fill="#f2f4f6" stroke="#314f66" stroke-width="2"/>
<text x="280.0" y="209" font-family="Arial, sans-serif" font-size="29" font-weight="bold" fill="#20252a" text-anchor="middle">Postman</text>
<text x="280.0" y="267" font-family="Arial, sans-serif" font-size="25" font-weight="normal" fill="#20252a" text-anchor="middle">Envía la petición HTTP</text>
<text x="280.0" y="301" font-family="Arial, sans-serif" font-size="25" font-weight="normal" fill="#20252a" text-anchor="middle">con los datos en JSON</text>
<rect x="600" y="170" width="400" height="170" fill="white" stroke="#314f66" stroke-width="2"/>
<rect x="600" y="170" width="400" height="58" fill="#f2f4f6" stroke="#314f66" stroke-width="2"/>
<text x="800.0" y="209" font-family="Arial, sans-serif" font-size="29" font-weight="bold" fill="#20252a" text-anchor="middle">RegistrosController</text>
<text x="800.0" y="267" font-family="Arial, sans-serif" font-size="25" font-weight="normal" fill="#20252a" text-anchor="middle">Recibe la petición</text>
<text x="800.0" y="301" font-family="Arial, sans-serif" font-size="25" font-weight="normal" fill="#20252a" text-anchor="middle">y devuelve la respuesta</text>
<rect x="1120" y="170" width="400" height="170" fill="white" stroke="#314f66" stroke-width="2"/>
<rect x="1120" y="170" width="400" height="58" fill="#f2f4f6" stroke="#314f66" stroke-width="2"/>
<text x="1320.0" y="209" font-family="Arial, sans-serif" font-size="29" font-weight="bold" fill="#20252a" text-anchor="middle">RegistroService</text>
<text x="1320.0" y="267" font-family="Arial, sans-serif" font-size="25" font-weight="normal" fill="#20252a" text-anchor="middle">Valida y coordina</text>
<text x="1320.0" y="301" font-family="Arial, sans-serif" font-size="25" font-weight="normal" fill="#20252a" text-anchor="middle">la operación solicitada</text>
<rect x="1120" y="540" width="400" height="170" fill="white" stroke="#314f66" stroke-width="2"/>
<rect x="1120" y="540" width="400" height="58" fill="#f2f4f6" stroke="#314f66" stroke-width="2"/>
<text x="1320.0" y="579" font-family="Arial, sans-serif" font-size="29" font-weight="bold" fill="#20252a" text-anchor="middle">RegistroRepository</text>
<text x="1320.0" y="637" font-family="Arial, sans-serif" font-size="25" font-weight="normal" fill="#20252a" text-anchor="middle">Implementa el contrato</text>
<text x="1320.0" y="671" font-family="Arial, sans-serif" font-size="25" font-weight="normal" fill="#20252a" text-anchor="middle">IRegistroRepository</text>
<rect x="600" y="540" width="400" height="170" fill="white" stroke="#314f66" stroke-width="2"/>
<rect x="600" y="540" width="400" height="58" fill="#f2f4f6" stroke="#314f66" stroke-width="2"/>
<text x="800.0" y="579" font-family="Arial, sans-serif" font-size="29" font-weight="bold" fill="#20252a" text-anchor="middle">BitacoraDbContext</text>
<text x="800.0" y="637" font-family="Arial, sans-serif" font-size="25" font-weight="normal" fill="#20252a" text-anchor="middle">Configura las tablas</text>
<text x="800.0" y="671" font-family="Arial, sans-serif" font-size="25" font-weight="normal" fill="#20252a" text-anchor="middle">y guarda mediante EF Core</text>
<rect x="80" y="540" width="400" height="170" fill="white" stroke="#314f66" stroke-width="2"/>
<rect x="80" y="540" width="400" height="58" fill="#f2f4f6" stroke="#314f66" stroke-width="2"/>
<text x="280.0" y="579" font-family="Arial, sans-serif" font-size="29" font-weight="bold" fill="#20252a" text-anchor="middle">SQLite</text>
<text x="280.0" y="637" font-family="Arial, sans-serif" font-size="25" font-weight="normal" fill="#20252a" text-anchor="middle">Archivo local</text>
<text x="280.0" y="671" font-family="Arial, sans-serif" font-size="25" font-weight="normal" fill="#20252a" text-anchor="middle">App_Data/bitacora.db</text>
<polyline points="480,255 600,255" fill="none" stroke="#314f66" stroke-width="3"/>
<polygon points="600.00,255.00 586.49,261.51 586.49,248.49" fill="#314f66"/>
<polyline points="1000,255 1120,255" fill="none" stroke="#314f66" stroke-width="3"/>
<polygon points="1120.00,255.00 1106.49,261.51 1106.49,248.49" fill="#314f66"/>
<polyline points="1320,340 1320,540" fill="none" stroke="#314f66" stroke-width="3"/>
<polygon points="1320.00,540.00 1313.49,526.49 1326.51,526.49" fill="#314f66"/>
<polyline points="1120,625 1000,625" fill="none" stroke="#314f66" stroke-width="3"/>
<polygon points="1000.00,625.00 1013.51,618.49 1013.51,631.51" fill="#314f66"/>
<polyline points="600,625 480,625" fill="none" stroke="#314f66" stroke-width="3"/>
<polygon points="480.00,625.00 493.51,618.49 493.51,631.51" fill="#314f66"/>
<text x="80" y="793" font-family="Arial, sans-serif" font-size="25" font-weight="normal" fill="#56616b" text-anchor="start">El contrato IRegistroRepository pertenece a Application; su implementación está en Infrastructure.</text>
<text x="80" y="840" font-family="Arial, sans-serif" font-size="25" font-weight="normal" fill="#56616b" text-anchor="start">La respuesta vuelve al cliente por las mismas capas, con un código HTTP y JSON cuando corresponde.</text>
</svg>